<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;500;600;700;800;900&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Carbon Car Wash" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Carbon Car Wash</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      Static chrome so the page is not blank while React downloads: the CSS
      bundle lands about a second before the JS on a slow connection. React
      replaces this on mount, and it deliberately omits anything role-specific
      so nothing has to change when it does.
    -->
    <div id="root">
      <div class="page-glow min-h-screen">
        <header
          class="sticky top-0 z-40 border-b border-primary/40 bg-[#181818]/90 backdrop-blur"
        >
          <div
            class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-x-4 gap-y-1 px-3 py-2"
          >
            <span
              class="font-heading text-xl uppercase tracking-wide text-primary"
              >Carbon Car Wash</span
            >
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
